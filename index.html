<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0a0d">
    <meta name="description" content="C3 by canc3r — games, manga, movies, music, and more.">
    <meta property="og:title" content="C3 — by canc3r">
    <meta property="og:description" content="A dark, personal hub for games and media.">
    <meta property="og:image" content="/image.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="/image.png">
    <link rel="icon" type="image/png" href="/image.png">
    <link rel="apple-touch-icon" href="/image.png">
    <link rel="stylesheet" href="/style.css">
    <title>C3</title>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#home" aria-label="C3 home">
          <img src="/image.png" alt="" class="brand-icon">
          <span>C<span class="brand-pink">3</span></span>
        </a>
        <div class="side-label">LIBRARY</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-item" data-view="games"><span class="nav-icon">✣</span>Games</button>
          <button class="nav-item" data-view="movies"><span class="nav-icon">▣</span>Movies &amp; TV</button>
          <button class="nav-item" data-view="manga"><span class="nav-icon">▤</span>Manga</button>
          <button class="nav-item" data-view="music"><span class="nav-icon">♫</span>Music</button>
          <button class="nav-item" data-view="cloud"><span class="nav-icon">⌁</span>Cloud games</button>
        </nav>
        <div class="side-label side-label-spaced">MORE</div>
        <nav class="main-nav" aria-label="More">
          <button class="nav-item" data-view="extensions"><span class="nav-icon">⊞</span>Extensions</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <span class="status-dot"></span>
          <span>PERSONAL HUB <b>·</b> C3</span>
          <small>v2.0</small>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>canc3r</span><i>/</i><strong id="current-section">Home</strong></div>
          <div class="top-actions">
            <label class="global-search">
              <span aria-hidden="true">⌕</span>
              <input id="global-search" type="search" placeholder="Search this section" aria-label="Search this section">
              <kbd>/</kbd>
            </label>
            <button class="icon-button" id="settings-shortcut" aria-label="Open settings" title="Settings">⚙</button>
          </div>
        </header>
        <div id="view-root" class="view-root" tabindex="-1"></div>
        <footer class="footer">
          <span>Built for the curious <b>✳</b></span>
          <span>Games by <a href="https://github.com/gmshelf/seraph" target="_blank" rel="noreferrer">GMShelf / Seraph</a></span>
        </footer>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="player-dialog" class="player-dialog">
      <div class="dialog-top">
        <div><span class="eyebrow">NOW PLAYING</span><h2 id="player-title">Player</h2></div>
        <button class="icon-button dialog-close" data-close-dialog aria-label="Close player">×</button>
      </div>
      <video id="video-player" controls playsinline></video>
      <p id="player-message" class="muted"></p>
    </dialog>

    <dialog id="detail-dialog" class="detail-dialog">
      <div class="dialog-top">
        <div><span class="eyebrow">MANGA</span><h2 id="detail-title">Details</h2></div>
        <button class="icon-button dialog-close" data-close-dialog aria-label="Close details">×</button>
      </div>
      <div id="detail-content"></div>
    </dialog>

    <audio id="audio-player" preload="none"></audio>
  </body>
</html>
